<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="auraBg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040816"/>
      <stop offset="100%" stop-color="#0a1230"/>
    </linearGradient>
    <linearGradient id="auraCard" x1="0" y1="0" x2="300" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1b3e"/>
      <stop offset="100%" stop-color="#070d1e"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#auraBg)"/>
  <circle cx="450" cy="120" r="140" fill="#00f5ff" fill-opacity="0.1" filter="blur(50px)"/>

  <!-- Main Platform Window -->
  <g transform="translate(40, 30)">
    <rect width="520" height="280" rx="16" fill="url(#auraCard)" stroke="rgba(0,245,255,0.25)" stroke-width="1.5"/>
    
    <!-- Window Bar -->
    <rect width="520" height="36" rx="16" fill="rgba(255,255,255,0.04)"/>
    <circle cx="20" cy="18" r="4" fill="#ef4444"/>
    <circle cx="34" cy="18" r="4" fill="#eab308"/>
    <circle cx="48" cy="18" r="4" fill="#22c55e"/>
    <text x="70" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">aurapay-platform.app • High-Speed Web Portal</text>
    <rect x="420" y="10" width="85" height="18" rx="9" fill="rgba(0,245,255,0.15)"/>
    <text x="430" y="22" fill="#00f5ff" font-family="sans-serif" font-size="10" font-weight="bold">320ms TTFB</text>

    <!-- Inner Content -->
    <!-- Metric Box 1 -->
    <rect x="25" y="55" width="145" height="75" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="38" y="78" fill="#94a3b8" font-family="sans-serif" font-size="11">Monthly Inquiries</text>
    <text x="38" y="108" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">+310%</text>

    <!-- Metric Box 2 -->
    <rect x="185" y="55" width="145" height="75" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="198" y="78" fill="#94a3b8" font-family="sans-serif" font-size="11">Conversion Rate</text>
    <text x="198" y="108" fill="#00f5ff" font-family="sans-serif" font-size="20" font-weight="bold">4.8x Lift</text>

    <!-- Metric Box 3 -->
    <rect x="345" y="55" width="145" height="75" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="358" y="78" fill="#94a3b8" font-family="sans-serif" font-size="11">Booking Speed</text>
    <text x="358" y="108" fill="#a855f7" font-family="sans-serif" font-size="20" font-weight="bold">Instant 24/7</text>

    <!-- Big Growth Chart Line -->
    <g transform="translate(25, 145)">
      <rect width="465" height="115" rx="12" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.05)"/>
      <path d="M20 90 Q 120 75 220 50 T 440 18" stroke="#00f5ff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="20" cy="90" r="4" fill="#38bdf8"/>
      <circle cx="220" cy="50" r="4" fill="#00f5ff"/>
      <circle cx="440" cy="18" r="6" fill="#a855f7"/>
      <text x="25" y="30" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">Lead Growth Trajectory</text>
    </g>
  </g>
</svg>
